name: Unit Tests 🧪
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and Test
        run: |
          npm ci
          npm run lint:check
          npm run lint:format:check
          npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'

      - name: Build dist
        run: |
          npm ci
          npm run build

  integration:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        branch: ${{ github.actor == 'dependabot[bot]' && fromJSON('["gh-pages"]') || fromJSON('["gh-pages", "no-pages"]') }}
        commit: ${{ github.actor == 'dependabot[bot]' && fromJSON('["singleCommit"]') || fromJSON('["singleCommit", "add commits"]') }}
      max-parallel: 1
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy
        id: unmodified
        uses: ./
        with:
          folder: integration
          branch: ${{ matrix.branch }}
          single-commit: ${{ matrix.commit == 'singleCommit' }}
          dry-run: true

      # Usually, this should be skipped, but if the upstream gh-pages
      # branch doesn't match ours, it should still be a success.
      - name: Check step output
        run: |
          [[ \
          ${{steps.unmodified.outputs.deployment-status}} = skipped || \
          ${{steps.unmodified.outputs.deployment-status}} = success \
          ]]

      - name: Tweak content to publish to existing branch
        if: ${{ matrix.branch == 'gh-pages' }}
        run: |
          echo "<!-- just sayin -->" >> integration/index.html

      - name: Deploy with modifications to existing branch
        id: modified
        uses: ./
        if: ${{ matrix.branch == 'gh-pages' }}
        with:
          folder: integration
          branch: ${{ matrix.branch }}
          single-commit: ${{ matrix.commit == 'singleCommit' }}
          dry-run: true

      # The modified deployment should be a success, and not skipped.
      - name: Check step output
        if: ${{ matrix.branch == 'gh-pages' }}
        run: |
          [[ \
          ${{steps.modified.outputs.deployment-status}} = success \
          ]]
